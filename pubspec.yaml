name: pdfcore
description: Read, edit and write PDF pages, vector paths, text, images, forms and resources in pure Dart.
version: 0.1.0
homepage: https://github.com/focale-editor/pdfcore
repository: https://github.com/focale-editor/pdfcore

topics:
  - pdf
  - vector-graphics
  - document
  - codec
  - file-format

screenshots:
  - description: 'A flat illustration of PDF pages with editable text and vector graphics.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  zcodec: '>=0.2.5 <0.3.0'

dev_dependencies:
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 PdfCore changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
